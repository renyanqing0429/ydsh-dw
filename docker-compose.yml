version: "3.8"

# 云购生活数仓项目 —— Hive 4.0 + MySQL 8.0 容器编排
# 使用方法：
#   docker compose up -d          # 首次启动会拉取镜像，耐心等待
#   docker ps                     # 确认三个容器均为 Up 状态
#   docker exec -it hive-server beeline -u jdbc:hive2://localhost:10000
#
# 数据文件放在 ./data/ 目录下（容器内映射为 /data）

services:
  mysql:
    image: mysql:8.0
    container_name: metastore-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  hive-metastore:
    image: apache/hive:4.0.0
    container_name: hive-metastore
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: mysql
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=com.mysql.cj.jdbc.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:mysql://mysql:3306/metastore_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
        -Djavax.jdo.option.ConnectionUserName=root
        -Djavax.jdo.option.ConnectionPassword=root
    ports:
      - "9083:9083"

  hive-server:
    image: apache/hive:4.0.0
    container_name: hive-server
    depends_on:
      - hive-metastore
    environment:
      SERVICE_NAME: hiveserver2
      SERVICE_OPTS: >-
        -Dhive.metastore.uris=thrift://hive-metastore:9083
    ports:
      - "10000:10000"
      - "10002:10002"
    volumes:
      - ./data:/data
      - ./sql:/sql

volumes:
  mysql_data:
