<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>云购生活 · 数仓经营分析看板</title>
<style>
  :root{
    --blue:#1e4fd8; --blue-soft:#e8eeff;
    --teal:#0d9488; --violet:#7c3aed; --amber:#d97706; --rose:#e11d48;
    --ink:#0f172a; --sub:#64748b; --faint:#94a3b8;
    --line:#e5eaf2; --bg:#f5f7fb; --card:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
    padding:0 0 40px;
  }
  .wrap{max-width:1360px;margin:0 auto;padding:0 28px}

  /* ---------- 顶栏 ---------- */
  header{
    background:linear-gradient(120deg,#10214f 0%,#1e4fd8 62%,#2f6fe4 100%);
    color:#fff; padding:26px 0 30px; margin-bottom:-34px;
  }
  .head-in{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{
    width:44px;height:44px;border-radius:11px;background:rgba(255,255,255,.16);
    display:grid;place-items:center;font-size:20px;font-weight:700;
    border:1px solid rgba(255,255,255,.28);
  }
  h1{font-size:21px;font-weight:600;letter-spacing:.3px}
  .tagline{font-size:12.5px;color:rgba(255,255,255,.72);margin-top:5px;letter-spacing:.2px}
  .badges{display:flex;gap:10px;flex-wrap:wrap}
  .badge{
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);
    border-radius:8px;padding:7px 13px;font-size:12px;color:rgba(255,255,255,.9);
    backdrop-filter:blur(4px);
  }
  .badge b{font-weight:600;color:#fff}

  /* ---------- KPI ---------- */
  .kpis{
    display:grid;grid-template-columns:repeat(6,1fr);gap:14px;
    margin-top:52px;
  }
  .kpi{
    background:var(--card);border:1px solid var(--line);border-radius:13px;
    padding:16px 16px 15px;position:relative;overflow:hidden;
    box-shadow:0 1px 2px rgba(15,23,42,.04);
  }
  .kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,var(--blue))}
  .kpi .k-label{font-size:12px;color:var(--sub);letter-spacing:.2px}
  .kpi .k-value{
    font-size:23px;font-weight:650;margin-top:7px;letter-spacing:-.3px;
    font-variant-numeric:tabular-nums;color:var(--ink);
  }
  .kpi .k-sub{font-size:11.5px;color:var(--faint);margin-top:6px;line-height:1.5}

  /* ---------- 卡片网格 ---------- */
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:14px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:13px;
    padding:17px 18px 15px;box-shadow:0 1px 2px rgba(15,23,42,.04);
    display:flex;flex-direction:column;min-width:0;
  }
  .card-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
  .card-t{font-size:14px;font-weight:600;letter-spacing:.2px}
  .card-n{font-size:11.5px;color:var(--faint);text-align:right;line-height:1.5}
  .span-4{grid-column:span 4}.span-5{grid-column:span 5}
  .span-6{grid-column:span 6}.span-7{grid-column:span 7}
  .span-8{grid-column:span 8}.span-12{grid-column:span 12}
  svg{display:block;width:100%;height:auto;overflow:visible}

  /* ---------- 横条 ---------- */
  .bars{display:flex;flex-direction:column;gap:9px}
  .bar-row{display:grid;grid-template-columns:82px 1fr 88px;align-items:center;gap:10px}
  .bar-lb{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar-track{height:16px;background:#f1f4f9;border-radius:4px;overflow:hidden;position:relative}
  .bar-fill{height:100%;border-radius:4px;background:var(--blue);transition:width .5s ease}
  .bar-val{font-size:12px;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
  .bar-val i{font-style:normal;color:var(--faint);font-size:11px;margin-left:4px}

  /* 双条（RFM 对比） */
  .dual{display:flex;flex-direction:column;gap:11px}
  .dual-row{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center}
  .dual-lb{font-size:12px;color:var(--sub);line-height:1.35}
  .dual-lb b{display:block;color:var(--ink);font-weight:600;font-size:12.5px}
  .dual-track{display:flex;flex-direction:column;gap:3px}
  .mini{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--faint)}
  .mini .t{flex:1;height:9px;background:#f1f4f9;border-radius:3px;overflow:hidden}
  .mini .f{height:100%;border-radius:3px}
  .mini .v{width:46px;text-align:right;font-variant-numeric:tabular-nums;color:var(--sub)}

  /* ---------- 环形图图例 ---------- */
  .donut-wrap{display:flex;align-items:center;gap:18px}
  .legend{display:flex;flex-direction:column;gap:9px;flex:1;min-width:0}
  .lg-row{display:flex;align-items:center;gap:8px;font-size:12px}
  .dot{width:9px;height:9px;border-radius:2.5px;flex:none}
  .lg-name{color:var(--sub);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lg-val{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:500}
  .lg-pct{color:var(--faint);width:44px;text-align:right;font-variant-numeric:tabular-nums}

  /* ---------- 表格 ---------- */
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{
    text-align:left;color:var(--sub);font-weight:500;padding:7px 8px;
    border-bottom:1px solid var(--line);font-size:11.5px;white-space:nowrap;
  }
  td{padding:8px;border-bottom:1px solid #f2f5fa;font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:none}
  td.num,th.num{text-align:right}
  .pill{
    display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;
    background:var(--blue-soft);color:var(--blue);
  }
  .pill.warn{background:#fef3c7;color:#b45309}
  .pill.gray{background:#f1f5f9;color:#64748b}

  /* ---------- 漏斗 ---------- */
  .fnl-note{font-size:11.5px;color:var(--sub);line-height:1.7;margin-top:10px;
    border-top:1px dashed var(--line);padding-top:10px}
  .fnl-note b{color:var(--rose);font-weight:600}

  footer{
    max-width:1360px;margin:26px auto 0;padding:16px 28px 0;
    border-top:1px solid var(--line);display:flex;justify-content:space-between;
    flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--faint);
  }
  @media (max-width:1180px){
    .kpis{grid-template-columns:repeat(3,1fr)}
    .span-4,.span-5,.span-6,.span-7,.span-8{grid-column:span 12}
  }
  @media (max-width:640px){
    .kpis{grid-template-columns:repeat(2,1fr)}
    .wrap{padding:0 16px}
  }
</style>
</head>
<body>

<header>
  <div class="wrap head-in">
    <div class="brand">
      <div class="logo">云</div>
      <div>
        <h1>云购生活 · 数仓经营分析看板</h1>
        <div class="tagline">ODS → DWD → DWS → ADS 四层链路 · 数据源 Hive 4.0 / Tez</div>
      </div>
    </div>
    <div class="badges" id="badges"></div>
  </div>
</header>

<div class="wrap">
  <section class="kpis" id="kpis"></section>

  <section class="grid">
    <div class="card span-8">
      <div class="card-h">
        <div class="card-t">日 GMV 趋势</div>
        <div class="card-n" id="trend-note"></div>
      </div>
      <div id="trend"></div>
    </div>

    <div class="card span-4">
      <div class="card-h">
        <div class="card-t">渠道结构</div>
        <div class="card-n">按有效 GMV</div>
      </div>
      <div class="donut-wrap">
        <div id="donut" style="width:168px;flex:none"></div>
        <div class="legend" id="donut-legend"></div>
      </div>
    </div>

    <div class="card span-6">
      <div class="card-h">
        <div class="card-t">品类销售</div>
        <div class="card-n" id="cat-note"></div>
      </div>
      <div class="bars" id="cat-bars"></div>
    </div>

    <div class="card span-6">
      <div class="card-h">
        <div class="card-t">省份 GMV TOP 15</div>
        <div class="card-n">买家去重口径</div>
      </div>
      <div class="bars" id="prov-bars"></div>
    </div>

    <div class="card span-7">
      <div class="card-h">
        <div class="card-t">RFM 八客群</div>
        <div class="card-n">上条=用户占比　下条=GMV 占比</div>
      </div>
      <div class="dual" id="rfm-dual"></div>
    </div>

    <div class="card span-5">
      <div class="card-h">
        <div class="card-t">订单履约漏斗</div>
        <div class="card-n">提交 → 支付 → 完成</div>
      </div>
      <div id="funnel"></div>
      <div class="fnl-note" id="funnel-note"></div>
    </div>

    <div class="card span-7">
      <div class="card-h">
        <div class="card-t">单品销售 TOP 10</div>
        <div class="card-n" id="prod-note"></div>
      </div>
      <div class="bars" id="prod-bars"></div>
    </div>

    <div class="card span-5">
      <div class="card-h">
        <div class="card-t">门店坪效分布</div>
        <div class="card-n">横轴面积 ㎡　纵轴有效 GMV</div>
      </div>
      <div id="scatter"></div>
      <div class="fnl-note" id="store-note"></div>
    </div>

    <div class="card span-12">
      <div class="card-h">
        <div class="card-t">RFM 客群明细</div>
        <div class="card-n">R=距 2024-12-31 最近消费天数　F=有效订单数　M=有效消费额</div>
      </div>
      <table id="rfm-table"></table>
    </div>
  </section>
</div>

<footer>
  <div id="foot-left"></div>
  <div id="foot-right"></div>
</footer>

const C = {blue:'#1e4fd8', teal:'#0d9488', violet:'#7c3aed', amber:'#d97706', rose:'#e11d48',
           slate:'#94a3b8', pale:'#e8eeff'};
const PALETTE = [C.blue, C.teal, C.amber, C.violet, C.rose, '#0284c7', '#65a30d', '#db2777',
                 '#0891b2', '#c2410c', '#4f46e5', '#059669', '#b45309', '#9333ea', '#64748b'];

const nf = n => (n === null || n === undefined) ? '—' : Number(n).toLocaleString('zh-CN', {maximumFractionDigits:0});
const nf2 = n => (n === null || n === undefined) ? '—' : Number(n).toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2});
const wan = n => (n/10000).toFixed(2) + ' 万';
const pct = n => (n === null || n === undefined) ? '—' : Number(n).toFixed(2) + '%';
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ================= 日趋势（面积折线） ================= */
(function(){
  const rows = D.daily.filter(r => r.gmv !== null);
  const W = 900, H = 250, pl = 58, pr = 14, pt = 14, pb = 30;
  const iw = W - pl - pr, ih = H - pt - pb;
  const maxY = Math.max(...rows.map(r => r.gmv)) * 1.1;
  const X = i => pl + iw * i / (rows.length - 1);
  const Y = v => pt + ih * (1 - v / maxY);

  let line = '', area = '';
  rows.forEach((r, i) => {
    const cmd = i ? 'L' : 'M';
    line += cmd + X(i).toFixed(1) + ' ' + Y(r.gmv).toFixed(1) + ' ';
  });
  area = line + 'L' + X(rows.length-1).toFixed(1) + ' ' + (pt+ih) + ' L' + pl + ' ' + (pt+ih) + ' Z';

  // y 轴网格
  let grid = '';
  for (let k = 0; k <= 4; k++) {
    const y = pt + ih * k / 4, val = maxY * (1 - k/4);
    grid += '<line x1="' + pl + '" y1="' + y + '" x2="' + (W-pr) + '" y2="' + y + '" stroke="#eef2f8"/>' +
            '<text x="' + (pl-9) + '" y="' + (y+4) + '" text-anchor="end" font-size="10.5" fill="#94a3b8">' +
            (val/10000).toFixed(0) + '万</text>';
  }
  // x 轴：每月 1 日
  let ticks = '';
  rows.forEach((r, i) => {
    if (r.dt.slice(8, 10) === '01') {
      ticks += '<line x1="' + X(i) + '" y1="' + (pt+ih) + '" x2="' + X(i) + '" y2="' + (pt+ih+4) + '" stroke="#cbd5e1"/>' +
               '<text x="' + X(i) + '" y="' + (pt+ih+18) + '" text-anchor="middle" font-size="11" fill="#64748b">' +
               r.dt.slice(0, 7) + '</text>';
    }
  });
  // 均值线
  const avg = rows.reduce((s,r) => s + r.gmv, 0) / rows.length;
  const avgLine = '<line x1="' + pl + '" y1="' + Y(avg) + '" x2="' + (W-pr) + '" y2="' + Y(avg) +
                  '" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="5 4" opacity=".85"/>' +
                  '<text x="' + (W-pr-4) + '" y="' + (Y(avg)-7) + '" text-anchor="end" font-size="10.5" fill="#b45309">日均 ' + nf(avg) + '</text>';

  document.getElementById('trend').innerHTML =
    '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="height:250px">' +
      '<defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="' + C.blue + '" stop-opacity=".26"/>' +
        '<stop offset="100%" stop-color="' + C.blue + '" stop-opacity="0"/>' +
      '</linearGradient></defs>' +
      grid + ticks + avgLine +
      '<path d="' + area + '" fill="url(#ga)"/>' +
      '<path d="' + line + '" fill="none" stroke="' + C.blue + '" stroke-width="1.6" stroke-linejoin="round"/>' +
    '</svg>';

  const peak = rows.reduce((a, b) => b.gmv > a.gmv ? b : a);
  document.getElementById('trend-note').innerHTML =
    '峰值 ' + peak.dt + '　¥' + nf(peak.gmv) + '<br>日均 ¥' + nf(avg);
})();

/* ================= 渠道环形 ================= */
(function(){
  const rows = D.channel.slice().sort((a, b) => b.gmv - a.gmv);
  const total = rows.reduce((s, r) => s + r.gmv, 0);
  const S = 168, cx = S/2, cy = S/2, R = 66, r0 = 44;
  let a = -Math.PI/2, paths = '';
  rows.forEach((row, i) => {
    const ang = row.gmv / total * Math.PI * 2;
    const a1 = a, a2 = a + ang - 0.02;
    const large = (a2 - a1) > Math.PI ? 1 : 0;
    const p = (rad, ang) => (cx + rad*Math.cos(ang)).toFixed(2) + ' ' + (cy + rad*Math.sin(ang)).toFixed(2);
    paths += '<path d="M' + p(R,a1) + ' A' + R + ' ' + R + ' 0 ' + large + ' 1 ' + p(R,a2) +
             ' L' + p(r0,a2) + ' A' + r0 + ' ' + r0 + ' 0 ' + large + ' 0 ' + p(r0,a1) + ' Z" fill="' +
             PALETTE[i % PALETTE.length] + '"/>';
    a += ang;
  });
  const s = D.summary;
  document.getElementById('donut').innerHTML =
    '<svg viewBox="0 0 ' + S + ' ' + S + '" style="width:168px">' + paths +
      '<text x="' + cx + '" y="' + (cy-2) + '" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">' +
        nf(s.gmv/10000) + '万</text>' +
      '<text x="' + cx + '" y="' + (cy+15) + '" text-anchor="middle" font-size="10" fill="#94a3b8">有效 GMV</text>' +
    '</svg>';

  document.getElementById('donut-legend').innerHTML = rows.map((row, i) =>
    '<div class="lg-row">' +
      '<span class="dot" style="background:' + PALETTE[i % PALETTE.length] + '"></span>' +
      '<span class="lg-name">' + esc(row.channel) + '</span>' +
      '<span class="lg-val">' + wan(row.gmv) + '</span>' +
      '<span class="lg-pct">' + row.gmv_share + '%</span>' +
    '</div>').join('');
})();

/* ================= 通用横条 ================= */
function renderBars(el, rows, opt){
  const max = Math.max(...rows.map(r => r.value));
  const html = rows.map((r, i) => {
    const w = (r.value / max * 100).toFixed(1);
    const color = opt.colorAt ? opt.colorAt(i, r) : opt.color;
    return '<div class="bar-row">' +
      '<div class="bar-lb" title="' + esc(r.label) + '">' + esc(r.label) + '</div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + w + '%;background:' + color + '"></div></div>' +
      '<div class="bar-val">' + r.text + (r.extra ? '<i>' + r.extra + '</i>' : '') + '</div>' +
    '</div>';
  }).join('');
  document.getElementById(el).innerHTML = html;
}

  renderBars('prod-bars', rows, {color: C.teal});
  const p50 = D.product.find(r => r.cum_share_pct >= 50);
  const p80 = D.product.find(r => r.cum_share_pct >= 80);
  document.getElementById('prod-note').innerHTML =
    '共 ' + D.product.length + ' 个 SKU　' + p50.rank_no + ' 个撑起 50%　' + p80.rank_no + ' 个撑起 80%';
})();

/* ================= RFM 双条 ================= */
(function(){
  const rows = D.rfm.slice().sort((a, b) => b.gmv - a.gmv);
  document.getElementById('rfm-dual').innerHTML = rows.map(r =>
    '<div class="dual-row">' +
      '<div class="dual-lb"><b>' + esc(r.rfm_seg) + '</b>' + nf(r.user_cnt) + ' 人</div>' +
      '<div class="dual-track">' +
        '<div class="mini"><span style="width:26px">人数</span><div class="t">' +
          '<div class="f" style="width:' + (r.user_share*2.6) + '%;background:' + C.blue + '"></div></div>' +
          '<span class="v">' + r.user_share + '%</span></div>' +
        '<div class="mini"><span style="width:26px">GMV</span><div class="t">' +
          '<div class="f" style="width:' + (r.gmv_share*2.6) + '%;background:' + C.amber + '"></div></div>' +
          '<span class="v">' + r.gmv_share + '%</span></div>' +
      '</div>' +
    '</div>').join('');
})();

/* ================= 漏斗 ================= */
(function(){
  const steps = D.funnel.slice().sort((a, b) => a.step_no - b.step_no);
  const W = 520, H = 268, top = 12, barH = 58, gap = 30;
  const maxW = 340, cx = W/2;
  const maxCnt = steps[0].order_cnt;
  let svg = '';
  steps.forEach((s, i) => {
    const y = top + i * (barH + gap);
    const w1 = maxW * s.order_cnt / maxCnt;
    const w2 = i < steps.length - 1
      ? maxW * steps[i+1].order_cnt / maxCnt
      : w1 * 0.94;
    const fill = ['#1e4fd8', '#3b82f6', '#93c5fd'][i] || '#bfdbfe';
    svg += '<polygon points="' +
      (cx-w1/2) + ',' + y + ' ' + (cx+w1/2) + ',' + y + ' ' +
      (cx+w2/2) + ',' + (y+barH) + ' ' + (cx-w2/2) + ',' + (y+barH) +
      '" fill="' + fill + '" opacity="' + (0.92 - i*0.08) + '"/>';
    svg += '<text x="' + cx + '" y="' + (y + 24) + '" text-anchor="middle" font-size="13" font-weight="600" fill="' +
           (i === 0 ? '#fff' : '#0f172a') + '">' + esc(s.step_name) + '</text>';
    svg += '<text x="' + cx + '" y="' + (y + 43) + '" text-anchor="middle" font-size="11.5" fill="' +
           (i === 0 ? 'rgba(255,255,255,.85)' : '#475569') + '">' +
           nf(s.order_cnt) + ' 笔 · ' + wan(s.order_amount) + '</text>';
    if (i > 0) {
      svg += '<text x="' + (W-4) + '" y="' + (y - 10) + '" text-anchor="end" font-size="11" fill="#e11d48">' +
             '↓ ' + s.rate_from_prev + '%　流失 ' + nf(s.lost_cnt) + ' 笔 / ' + wan(s.lost_amount) + '</text>';
    }
  });
  document.getElementById('funnel').innerHTML =
    '<svg viewBox="0 0 ' + W + ' ' + H + '" style="height:268px;width:100%">' + svg + '</svg>';

  const f1 = steps[0], f2 = steps[1];
  document.getElementById('funnel-note').innerHTML =
    '支付前流失 <b>' + wan(f1.lost_amount) + '</b>（待支付 2,116 + 已取消 2,101 + 退款中 817），' +
    '支付后未履约再流失 <b>' + wan(f2.lost_amount) + '</b>。全链路成交率 <b>' + steps[2].rate_from_top + '%</b>。';
})();

/* ================= 门店坪效散点 ================= */
(function(){
  const rows = D.store.filter(r => r.area && r.gmv);
  const W = 520, H = 272, pl = 52, pr = 12, pt = 12, pb = 50;
  const iw = W - pl - pr, ih = H - pt - pb;
  const maxX = Math.max(...rows.map(r => r.area)) * 1.05;
  const maxY = Math.max(...rows.map(r => r.gmv)) * 1.05;
  const X = v => pl + iw * v / maxX;
  const Y = v => pt + ih * (1 - v / maxY);
  const colorOf = lv => (lv && lv.indexOf('高效') === 0) ? C.teal
                     : (lv && lv.indexOf('低效') === 0) ? C.rose : C.slate;

  let dots = '';
  rows.forEach(r => {
    dots += '<circle cx="' + X(r.area).toFixed(1) + '" cy="' + Y(r.gmv).toFixed(1) + '" r="4.6" fill="' +
            colorOf(r.efficiency_level) + '" opacity=".78"><title>' + esc(r.store_name) + '　' +
            r.area + '㎡　¥' + nf(r.gmv) + '　' + nf2(r.gmv_per_sqm) + ' 元/㎡</title></circle>';
  });
  let grid = '';
  for (let k = 0; k <= 3; k++) {
    const y = pt + ih * k / 3;
    grid += '<line x1="' + pl + '" y1="' + y + '" x2="' + (W-pr) + '" y2="' + y + '" stroke="#eef2f8"/>' +
            '<text x="' + (pl-8) + '" y="' + (y+4) + '" text-anchor="end" font-size="10" fill="#94a3b8">' +
            ((maxY*(1-k/3))/10000).toFixed(0) + '万</text>';
  }
  [0, 200, 400, 600, 800].forEach(v => {
    if (v > maxX) return;
    grid += '<text x="' + X(v) + '" y="' + (pt+ih+16) + '" text-anchor="middle" font-size="10" fill="#94a3b8">' + v + '</text>';
  });
  grid += '<text x="' + (pl+iw/2) + '" y="' + (pt+ih+32) + '" text-anchor="middle" font-size="10.5" fill="#94a3b8">门店面积（㎡）</text>';

  const legend = [
    ['高效(前25%)', C.teal], ['中效(25~75%)', C.slate], ['低效(后25%)', C.rose]
  ].map(([n, c], i) =>
    '<g transform="translate(' + (pl + i*118) + ',0)">' +
      '<circle cx="4" cy="4" r="4" fill="' + c + '"/>' +
      '<text x="13" y="8" font-size="10.5" fill="#64748b">' + n + '</text></g>').join('');

  document.getElementById('scatter').innerHTML =
    '<svg viewBox="0 0 ' + W + ' ' + H + '" style="height:272px;width:100%">' + grid + dots +
      '<g transform="translate(0,' + (H-12) + ')">' + legend + '</g></svg>';

  const hi = rows.filter(r => r.efficiency_level && r.efficiency_level.indexOf('高效') === 0);
  const lo = rows.filter(r => r.efficiency_level && r.efficiency_level.indexOf('低效') === 0);
  const avg = a => a.reduce((s, r) => s + r, 0) / a.length;
  const hiArea = avg(hi.map(r => r.area)), hiSqm = avg(hi.map(r => r.gmv_per_sqm)), hiGmv = avg(hi.map(r => r.gmv));
  const loArea = avg(lo.map(r => r.area)), loSqm = avg(lo.map(r => r.gmv_per_sqm)), loGmv = avg(lo.map(r => r.gmv));
  document.getElementById('store-note').innerHTML =
    '高效组 <b style="color:#0d9488">' + hiArea.toFixed(0) + '㎡ · ' + nf2(hiSqm) + ' 元/㎡</b>，' +
    '低效组 ' + loArea.toFixed(0) + '㎡ · ' + nf2(loSqm) + ' 元/㎡。<br>' +
    'GMV 仅差 ' + ((hiGmv / loGmv - 1) * 100).toFixed(1) + '%，面积差 ' +
    (loArea / hiArea).toFixed(1) + ' 倍，<b style="color:#e11d48">坪效差 ' +
    (hiSqm / loSqm).toFixed(1) + ' 倍</b>。';
})();

/* ================= RFM 明细表 ================= */
(function(){
